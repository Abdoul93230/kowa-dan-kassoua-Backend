name: Deploy TAKTAK Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Oracle Cloud
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            echo "===== TAKTAK DEPLOYMENT ====="
            cd /opt/taktak/app

            echo "===== GIT UPDATE ====="
            git fetch origin main
            git reset --hard origin/main

            echo "===== DOCKER BUILD ====="
            sudo docker build -t taktak-backend:latest .

            echo "===== STOP OLD CONTAINER ====="
            sudo docker stop taktak-backend || true

            echo "===== REMOVE OLD CONTAINER ====="
            sudo docker rm taktak-backend || true

            echo "===== START NEW CONTAINER ====="
            sudo docker run -d \
              --name taktak-backend \
              --restart unless-stopped \
              --network taktak-network \
              --env-file /opt/taktak/app/.env \
              -p 127.0.0.1:5000:5000 \
              taktak-backend:latest

            echo "===== WAIT FOR STARTUP ====="
            sleep 8

            echo "===== CONTAINER STATUS ====="
            sudo docker ps --filter "name=taktak-backend"

            echo "===== BACKEND LOGS ====="
            sudo docker logs --tail 30 taktak-backend

            echo "===== HEALTH CHECK ====="
            curl -f http://127.0.0.1:5000/health

            echo
            echo "===== DEPLOYMENT SUCCESS ====="
